name: Release — Production Deploy

on:
  release:
    types: [published]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Quality gate — lint, type-check, migration gate, version bump (once)
  # ─────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality check & migration gate
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Check production migration status
        id: migration_check
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_POSTGRES_URL_NON_POOLING }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.PRODUCTION_POSTGRES_URL_NON_POOLING }}
        run: |
          echo "Running prisma migrate status against production database..."
          STATUS_OUTPUT=$(npx prisma migrate status 2>&1)
          STATUS_EXIT=$?
          echo "$STATUS_OUTPUT"

          if [ $STATUS_EXIT -ne 0 ]; then
            echo ""
            echo "::error::Production database has pending migrations."
            echo "::error::Run the 'Manual Database Migration' workflow first (environment=production, action=deploy), then re-publish this release."
            exit 1
          fi

          if echo "$STATUS_OUTPUT" | grep -q "following migration.*not yet been applied\|Database schema is not up to date"; then
            echo "::error::Pending migrations detected in status output. Run the manual migration workflow first."
            exit 1
          fi

          echo "Production database is up to date. Proceeding with release."

      - name: Extract version from release tag
        id: extract_version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION from tag: $TAG"

      - name: Bump version in package.json
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated package.json version to: ' + pkg.version);
          "

      - name: Commit version bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: 🔖 bump version to ${{ steps.extract_version.outputs.version }} [skip ci]"
          git push origin HEAD:main

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Load client registry — reads clients/_registry.json for the matrix
  # ─────────────────────────────────────────────────────────────────────────
  load-clients:
    name: Load client registry
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      clients: ${{ steps.registry.outputs.clients }}
    steps:
      - uses: actions/checkout@v4

      - name: Read registry
        id: registry
        run: |
          CLIENTS=$(cat clients/_registry.json)
          echo "clients=$CLIENTS" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Per-client production deploy — matrix: one job per client in parallel
  #
  # Each client must have its Vercel project ID in clients/<client>/web-project-id.
  # Each Vercel project is configured with NEXT_PUBLIC_TENANT=<client>.
  # Clients without a tenant override use the generic default config.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy production — ${{ matrix.client }}
    runs-on: ubuntu-latest
    needs: load-clients
    strategy:
      matrix:
        client: ${{ fromJson(needs.load-clients.outputs.clients) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read Vercel project ID for ${{ matrix.client }}
        id: project
        run: |
          PROJECT_ID=$(cat clients/${{ matrix.client }}/web-project-id)
          echo "id=$PROJECT_ID" >> $GITHUB_OUTPUT

      - name: Ensure framework is nextjs — ${{ matrix.client }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          PROJECT_ID="${{ steps.project.outputs.id }}"
          RESPONSE=$(curl -s -X PATCH \
            "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"framework":"nextjs"}')
          FRAMEWORK=$(echo "$RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);if(j.error){console.error('API error:',j.error.message);process.exit(1);}console.log(j.framework);})")
          echo "Project $PROJECT_ID framework: $FRAMEWORK"

      - name: Deploy to Vercel production — ${{ matrix.client }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          # Remove .git so Vercel treats this as a local deploy, not a repo-linked one.
          # Without this, vercel deploy would try to resolve the connected git integration
          # and ignore the VERCEL_PROJECT_ID we set above.
          rm -rf .git
          npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes
