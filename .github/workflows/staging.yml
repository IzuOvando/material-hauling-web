name: Staging — Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Quality gate — lint, type-check, and staging DB migration (runs once)
  # ─────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality check & migrate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run migrations on staging database
        env:
          DATABASE_URL: ${{ secrets.STAGING_POSTGRES_URL_NON_POOLING }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.STAGING_POSTGRES_URL_NON_POOLING }}
        run: npx prisma migrate deploy

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Load client registry — reads clients/_registry.json for the matrix
  # ─────────────────────────────────────────────────────────────────────────
  load-clients:
    name: Load client registry
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      clients: ${{ steps.registry.outputs.clients }}
    steps:
      - uses: actions/checkout@v4

      - name: Read registry
        id: registry
        run: |
          CLIENTS=$(cat clients/_registry.json)
          echo "clients=$CLIENTS" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Per-client staging deploy — matrix: one job per client in parallel
  #
  # Each client must have its Vercel project ID in clients/<client>/web-project-id.
  # Each Vercel project is configured with NEXT_PUBLIC_TENANT=<client>.
  # Clients without a tenant override use the generic default config.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy staging — ${{ matrix.client }}
    runs-on: ubuntu-latest
    needs: load-clients
    strategy:
      matrix:
        client: ${{ fromJson(needs.load-clients.outputs.clients) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Read Vercel project ID for ${{ matrix.client }}
        id: project
        run: |
          PROJECT_ID=$(cat clients/${{ matrix.client }}/web-project-id)
          echo "id=$PROJECT_ID" >> $GITHUB_OUTPUT

      - name: Ensure framework is nextjs — ${{ matrix.client }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          PROJECT_ID="${{ steps.project.outputs.id }}"
          RESPONSE=$(curl -s -X PATCH \
            "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"framework":"nextjs"}')
          FRAMEWORK=$(echo "$RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);if(j.error){console.error('API error:',j.error.message);process.exit(1);}console.log(j.framework);})")
          echo "Project $PROJECT_ID framework: $FRAMEWORK"

      - name: Deploy to Vercel staging — ${{ matrix.client }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          # Remove .git so Vercel treats this as a local deploy, not a repo-linked one.
          # Without this, vercel deploy would try to resolve the connected git integration
          # and ignore the VERCEL_PROJECT_ID we set above.
          rm -rf .git
          npx vercel deploy --target staging --token "$VERCEL_TOKEN" --yes
